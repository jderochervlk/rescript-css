name: Publish

on:
  push:
    branches:
      - main
    paths:
      - packages/rescript-css/package.json
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-publish
  cancel-in-progress: false
  queue: max

env:
  NODE_VERSION: 24.12.0
  PNPM_VERSION: 11.15.1
  NPM_VERSION: 11.15.0

jobs:
  version:
    name: Detect package version change
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.package.outputs.changed }}
      increased: ${{ steps.package.outputs.increased }}
      stable: ${{ steps.package.outputs.stable }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compare package versions
        id: package
        shell: bash
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          current_version="$(node --print "require('./packages/rescript-css/package.json').version")"
          previous_version=""

          if git cat-file -e "${PREVIOUS_SHA}:packages/rescript-css/package.json" 2>/dev/null; then
            previous_version="$(git show "${PREVIOUS_SHA}:packages/rescript-css/package.json" | node --print "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).version")"
          fi

          CURRENT_VERSION="${current_version}" PREVIOUS_VERSION="${previous_version}" node --input-type=module <<'NODE'
          import {writeFileSync} from "node:fs"

          const semverPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/u
          const numericIdentifierPattern = /^\d+$/u

          const parseVersion = value => {
            const match = semverPattern.exec(value)
            if (match === null) {
              return {_tag: "Invalid", value}
            }

            const prerelease = match[4]?.split(".") ?? []
            const hasInvalidNumericIdentifier = prerelease.some(
              identifier => numericIdentifierPattern.test(identifier) && identifier.length > 1 && identifier.startsWith("0"),
            )

            return hasInvalidNumericIdentifier
              ? {_tag: "Invalid", value}
              : {
                  _tag: "Version",
                  value,
                  major: Number(match[1]),
                  minor: Number(match[2]),
                  patch: Number(match[3]),
                  prerelease,
                }
          }

          const compareIdentifier = (left, right) => {
            if (left === right) {
              return 0
            }

            const leftIsNumeric = numericIdentifierPattern.test(left)
            const rightIsNumeric = numericIdentifierPattern.test(right)
            if (leftIsNumeric && rightIsNumeric) {
              return Number(left) < Number(right) ? -1 : 1
            }
            if (leftIsNumeric !== rightIsNumeric) {
              return leftIsNumeric ? -1 : 1
            }
            return left < right ? -1 : 1
          }

          const comparePrerelease = (left, right) => {
            if (left.length === 0 || right.length === 0) {
              return left.length === right.length ? 0 : left.length === 0 ? 1 : -1
            }

            for (let index = 0; index < Math.min(left.length, right.length); index += 1) {
              const comparison = compareIdentifier(left[index], right[index])
              if (comparison !== 0) {
                return comparison
              }
            }
            return left.length === right.length ? 0 : left.length < right.length ? -1 : 1
          }

          const compareVersions = (left, right) => {
            const coreComparison = ["major", "minor", "patch"]
              .map(field => left[field] - right[field])
              .find(comparison => comparison !== 0)
            return coreComparison === undefined ? comparePrerelease(left.prerelease, right.prerelease) : coreComparison
          }

          const current = parseVersion(process.env.CURRENT_VERSION)
          const previous = process.env.PREVIOUS_VERSION === "" ? {_tag: "Absent"} : parseVersion(process.env.PREVIOUS_VERSION)
          const invalidVersions = [current, previous].filter(version => version._tag === "Invalid")

          if (invalidVersions.length > 0) {
            console.error(`Invalid semantic version: ${invalidVersions.map(version => version.value).join(", ")}`)
            process.exitCode = 1
          } else {
            const currentVersion = current
            const previousVersion = previous
            const isStable = currentVersion.prerelease.length === 0
            const isChanged = previousVersion._tag === "Absent" || currentVersion.value !== previousVersion.value
            const isIncreased = previousVersion._tag === "Absent" || compareVersions(currentVersion, previousVersion) > 0
            writeFileSync(
              process.env.GITHUB_OUTPUT,
              `changed=${isChanged}\nincreased=${isIncreased}\nstable=${isStable}\n`,
              {encoding: "utf8", flag: "a"},
            )
          }
          NODE

  publish:
    name: Publish to npm
    needs: version
    if: >-
      always() && (
        (github.event_name == 'release' && github.event.release.prerelease == false) ||
        (github.event_name == 'push' && needs.version.outputs.changed == 'true' && needs.version.outputs.increased == 'true' && needs.version.outputs.stable == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/@jvlk/rescript-css
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain and install dependencies
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: false

      - name: Install trusted-publishing npm CLI
        shell: bash
        run: |
          npm install --global --prefix "${RUNNER_TEMP}/npm" npm@${NPM_VERSION}
          printf '%s\n' "${RUNNER_TEMP}/npm/bin" >> "${GITHUB_PATH}"

      - name: Verify trusted-publishing environment
        shell: bash
        run: |
          actual_npm_version="$(npm --version)"
          printf 'npm version: %s\n' "${actual_npm_version}"
          if [ "${actual_npm_version}" != "${NPM_VERSION}" ]; then
            printf '::error::Expected npm %s but found %s.\n' "${NPM_VERSION}" "${actual_npm_version}"
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            printf '::error::ACTIONS_ID_TOKEN_REQUEST_URL is unavailable.\n'
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            printf '::error::ACTIONS_ID_TOKEN_REQUEST_TOKEN is unavailable.\n'
            exit 1
          fi

      - name: Read package details
        id: package
        shell: bash
        run: |
          name="$(node --print "require('./packages/rescript-css/package.json').name")"
          version="$(node --print "require('./packages/rescript-css/package.json').version")"
          printf 'name=%s\n' "${name}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify release tag
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          expected_tag="v${VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            printf 'Release tag %s does not match package version %s.\n' "${GITHUB_REF_NAME}" "${VERSION}"
            exit 1
          fi

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build package and examples
        run: pnpm build:all

      - name: Verify packed package
        run: pnpm package:check

      - name: Check registry
        id: registry
        shell: bash
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            printf 'published=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'published=false\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish package
        if: steps.registry.outputs.published == 'false'
        working-directory: packages/rescript-css
        run: npm publish --access public

      - name: Report existing version
        if: steps.registry.outputs.published == 'true'
        run: echo "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} is already published."

      - name: Create GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            printf 'GitHub Release %s already exists.\n' "${tag}"
            exit 0
          fi

          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --title "${tag}" \
            --generate-notes
